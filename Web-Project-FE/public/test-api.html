<!DOCTYPE html>
<html>

<head>
  <title>API Test</title>
</head>

<body>
  <h1>Testing AI Recommendations API</h1>
  <button onclick="testAPI()">Test API</button>
  <div id="result"></div>

  <script>
    async function testAPI() {
      const resultDiv = document.getElementById('result');
      resultDiv.innerHTML = 'Loading...';

      try {
        const response = await fetch('/api/ai/recommendations', {
          method: 'GET',
          headers: {
            'Content-Type': 'application/json',
          }
        });

        console.log('Response status:', response.status);
        console.log('Response headers:', [...response.headers.entries()]);

        const text = await response.text();
        console.log('Response text:', text);

        if (!response.ok) {
          resultDiv.innerHTML = `<pre style="color: red;">Error ${response.status}: ${text}</pre>`;
          return;
        }

        const data = JSON.parse(text);
        resultDiv.innerHTML = `<pre style="color: green;">${JSON.stringify(data, null, 2)}</pre>`;

      } catch (error) {
        console.error('Fetch error:', error);
        resultDiv.innerHTML = `<pre style="color: red;">Error: ${error.message}</pre>`;
      }
    }
  </script>
</body>

</html>
